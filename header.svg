<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Ezequiel Magoga — Desenvolvedor Full Stack. React, TypeScript e Node.js. Programador na Inside Automação.">
  <title>Ezequiel Magoga — Desenvolvedor Full Stack</title>
  <style>
    .sans { font-family: "Inter", "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Fira Code", "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace; }

    /* ciclo de 12s: 0–45% Design, 50–95% Code */
    .design { animation: design 12s ease-in-out infinite; }
    .code   { animation: code 12s ease-in-out infinite; opacity: 0; }
    @keyframes design { 0%,45% { opacity: 1 } 50%,95% { opacity: 0 } 100% { opacity: 1 } }
    @keyframes code   { 0%,48% { opacity: 0 } 53%,92% { opacity: 1 } 97%,100% { opacity: 0 } }

    /* abas */
    .tab-design { animation: tabA 12s step-end infinite; }
    .tab-code   { animation: tabB 12s step-end infinite; }
    @keyframes tabA { 0% { fill: #FFFFFE } 48% { fill: #72757E } 97% { fill: #FFFFFE } }
    @keyframes tabB { 0% { fill: #72757E } 48% { fill: #FFFFFE } 97% { fill: #72757E } }
    .underline { animation: slide 12s ease-in-out infinite; }
    @keyframes slide { 0%,45% { transform: translateX(0) } 50%,95% { transform: translateX(74px) } 100% { transform: translateX(0) } }

    /* seleção sendo desenhada */
    .select { stroke-dasharray: 1180; stroke-dashoffset: 1180; animation: draw 12s ease-out infinite; }
    @keyframes draw { 0%,4% { stroke-dashoffset: 1180 } 14%,100% { stroke-dashoffset: 0 } }
    .pop  { opacity: 0; animation: pop 12s ease-out infinite; }
    .pop2 { opacity: 0; animation: pop2 12s ease-out infinite; }
    .pop3 { opacity: 0; animation: pop3 12s ease-out infinite; }
    @keyframes pop  { 0%,13% { opacity: 0 } 16%,100% { opacity: 1 } }
    @keyframes pop2 { 0%,18% { opacity: 0 } 21%,100% { opacity: 1 } }
    @keyframes pop3 { 0%,24% { opacity: 0 } 28%,100% { opacity: 1 } }

    /* linhas de código entrando uma a uma */
    .l { opacity: 0; }
    .l1 { animation: l1 12s ease-out infinite; } @keyframes l1 { 0%,52% { opacity: 0 } 54%,100% { opacity: 1 } }
    .l2 { animation: l2 12s ease-out infinite; } @keyframes l2 { 0%,56% { opacity: 0 } 58%,100% { opacity: 1 } }
    .l3 { animation: l3 12s ease-out infinite; } @keyframes l3 { 0%,60% { opacity: 0 } 62%,100% { opacity: 1 } }
    .l4 { animation: l4 12s ease-out infinite; } @keyframes l4 { 0%,64% { opacity: 0 } 66%,100% { opacity: 1 } }
    .l5 { animation: l5 12s ease-out infinite; } @keyframes l5 { 0%,68% { opacity: 0 } 70%,100% { opacity: 1 } }
    .l6 { animation: l6 12s ease-out infinite; } @keyframes l6 { 0%,72% { opacity: 0 } 74%,100% { opacity: 1 } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .design, .code, .select, .pop, .pop2, .pop3, .l, .cursor, .underline, .tab-design, .tab-code { animation: none; }
      .select { stroke-dashoffset: 0; } .pop, .pop2, .pop3 { opacity: 1; }
    }
  </style>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2E2E36" />
    </pattern>
    <linearGradient id="brand" x1="0" x2="1">
      <stop offset="0" stop-color="#7F5AF0" />
      <stop offset="1" stop-color="#2CB67D" />
    </linearGradient>
  </defs>

  <!-- janela -->
  <rect x="1" y="1" width="998" height="318" rx="16" fill="#16161A" stroke="#2E2E36" stroke-width="2" />
  <rect x="2" y="44" width="996" height="274" fill="url(#dots)" />
  <rect x="2" y="2" width="996" height="42" rx="15" fill="#1E1E24" />
  <rect x="2" y="30" width="996" height="14" fill="#1E1E24" />
  <line x1="2" y1="44" x2="998" y2="44" stroke="#2E2E36" stroke-width="1.5" />
  <circle cx="26" cy="23" r="6" fill="#FF5F57" />
  <circle cx="46" cy="23" r="6" fill="#FEBC2E" />
  <circle cx="66" cy="23" r="6" fill="#28C840" />
  <text x="96" y="28" class="mono" font-size="13" fill="#72757E">ezequiel-magoga.tsx</text>

  <!-- abas Design / Code -->
  <text x="836" y="28" class="sans tab-design" font-size="14" font-weight="600" fill="#FFFFFE">Design</text>
  <text x="914" y="28" class="sans tab-code" font-size="14" font-weight="600" fill="#72757E">Code</text>
  <rect x="834" y="40" width="52" height="3" rx="1.5" fill="url(#brand)" class="underline" />

  <!-- VISÃO DESIGN -->
  <g class="design">
    <!-- etiqueta da camada -->
    <g class="pop">
      <rect x="245" y="82" width="196" height="24" rx="4" fill="#7F5AF0" />
      <text x="257" y="99" class="sans" font-size="13" font-weight="600" fill="#FFFFFE">◇ Dev · Full Stack</text>
    </g>

    <!-- nome -->
    <text x="500" y="168" text-anchor="middle" class="sans" font-size="54" font-weight="800" fill="#FFFFFE" letter-spacing="-1">Ezequiel Magoga</text>

    <!-- caixa de seleção -->
    <rect x="245" y="110" width="510" height="80" fill="none" stroke="#7F5AF0" stroke-width="2" class="select" />
    <g class="pop" fill="#FFFFFE" stroke="#7F5AF0" stroke-width="2">
      <rect x="240" y="105" width="10" height="10" />
      <rect x="750" y="105" width="10" height="10" />
      <rect x="240" y="185" width="10" height="10" />
      <rect x="750" y="185" width="10" height="10" />
    </g>

    <!-- medida -->
    <g class="pop2">
      <rect x="468" y="200" width="64" height="20" rx="4" fill="#7F5AF0" />
      <text x="500" y="214" text-anchor="middle" class="mono" font-size="11" fill="#FFFFFE">510 × 80</text>
    </g>

    <!-- subtítulo -->
    <text x="500" y="262" text-anchor="middle" class="sans pop3" font-size="20" fill="#94A1B2">React · TypeScript · Node.js  —  Programador na Inside Automação</text>
  </g>

  <!-- VISÃO CODE -->
  <g class="code mono" font-size="22">
    <text x="120" y="102" class="l l1"><tspan fill="#72757E">&lt;</tspan><tspan fill="#7F5AF0">Dev</tspan></text>
    <text x="160" y="138" class="l l2"><tspan fill="#2CB67D">name</tspan><tspan fill="#72757E">=</tspan><tspan fill="#F7B955">"Ezequiel Magoga"</tspan></text>
    <text x="160" y="174" class="l l3"><tspan fill="#2CB67D">role</tspan><tspan fill="#72757E">=</tspan><tspan fill="#F7B955">"Full Stack"</tspan></text>
    <text x="160" y="210" class="l l4"><tspan fill="#2CB67D">stack</tspan><tspan fill="#72757E">={[</tspan><tspan fill="#F7B955">"React"</tspan><tspan fill="#72757E">, </tspan><tspan fill="#F7B955">"TypeScript"</tspan><tspan fill="#72757E">, </tspan><tspan fill="#F7B955">"Node.js"</tspan><tspan fill="#72757E">]}</tspan></text>
    <text x="160" y="246" class="l l5"><tspan fill="#2CB67D">at</tspan><tspan fill="#72757E">=</tspan><tspan fill="#F7B955">"Inside Automação"</tspan></text>
    <g class="l l6">
      <text x="120" y="282"><tspan fill="#72757E">/&gt;</tspan></text>
      <rect x="152" y="264" width="12" height="24" fill="#2CB67D" class="cursor" />
    </g>
    <!-- números de linha -->
    <g fill="#3A3A44" font-size="16" text-anchor="end">
      <text x="92" y="101">1</text><text x="92" y="137">2</text><text x="92" y="173">3</text>
      <text x="92" y="209">4</text><text x="92" y="245">5</text><text x="92" y="281">6</text>
    </g>
  </g>
</svg>
